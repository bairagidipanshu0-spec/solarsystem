<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>css animation</title>
        <style>
            body{
                background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRYz8Mehpggo5IF2s7_QOVXZwqI7cYtrhqc9CB9BWVxfciV8xWItkAfvBM&s=10');
                background-size: cover;
            }
            .sun{
                width: 170px;
                height: 170px;
                margin: 300px auto;
                background: red ;
                border-radius: 170px;
                background-image: url(./sun.jpg);
                background-size:cover ;
                position: relative;
            }
            .mercury{
                width: 100px;
                height: 100px;
                border-radius: 100px;
                background-image: url('./mercury.jpg');
                background-size: cover;
                position: absolute;
                top: 80px;
                left: -200px;
                transform-origin: 250px;
                animation-name: mercury;
                animation-duration: 3s;
                animation-timing-function:linear;
                animation-iteration-count: infinite;
                
            }
            @keyframes mercury{
                0%{
                    transform: rotateZ(0deg);
                }
                100%{
                    transform: rotateZ(360deg);
                }
            }
            .venus{
                width: 120px;
                height: 120px;
                border-radius: 120px;
                background-image: url('./venus.jpg');
                background-size: cover;
                position: absolute;
                left: 300px;
                bottom: 100px;
                transform-origin: -300px;
                animation-name: venus;
                animation-timing-function: linear;
                animation-duration: 3s;
                animation-iteration-count: infinite;
                animation-delay: 2.5s;
                
            }
            @keyframes venus{
                0%{
                    transform: rotateZ(0deg);
                }
                100%{
                    transform: rotateZ(360deg);
                }
            }
            .earth{
                width: 130px;
                height: 130px;
                border-radius: 130px;
                background-image: url(./earth.jpg);
                background-size: cover;
                position: absolute;
                transform-origin: -350px;
                left: 450px;
                top: 100px;
                animation-name: earth;
                animation-duration: 3s;
                animation-timing-function: linear;
                animation-iteration-count: infinite;
                animation-delay: 0.6s;
                
            }
            @keyframes earth{
                0%{
                    transform: rotateZ(0deg);
                }
                100%{
                    transform: rotateZ(360deg);
                }
            }
            .mars{
                width: 110px;
                height: 110px;
                border-radius: 110px;
                background-image: url(./mars.jpg);
                background-size: cover;
                position: absolute;
                left: 600px;
                bottom: 100px;
                transform-origin: -450px;
                animation-name: mars;
                animation-timing-function: linear;
                animation-duration: 3s;
                animation-iteration-count: infinite;
                animation-delay: 1.5s;
                
            }
            @keyframes mars{
                0%{
                    transform: rotateZ(0deg);
                }
                100%{
                    transform: rotateZ(360deg);
                }
            }
            .jupiter{
                width: 200px;
                height: 200px;
                border-radius: 200px;
                background-image: url(./jupiter.jpg);
                background-size: cover;
                position: absolute;
                right: 500px;
                top: 90px;
                transform-origin: 600px;
                animation-name: jupiter;
                animation-timing-function: linear;
                animation-iteration-count: infinite;
                animation-duration: 3s;
                animation-delay: 3s;
                
            }
            @keyframes jupiter{
                0%{
                    transform: rotateZ(0deg);
                }
                100%{
                    transform: rotateZ(360deg);
                }
            }
            .saturn{
                width: 160px;
                height: 160px;
                border-radius: 160px;
                background-image: url(./saturn.jpg);
                background-size: cover;
                position: absolute;
                right: 700px;
                bottom: 100px                                                                                                                                                                                             ;
                animation-name: saturn;
                animation-timing-function: linear;
                animation-iteration-count: infinite;
                animation-duration: 3s;
                animation-delay: 2.5s;
                transform-origin: 650px;
                
            }
            @keyframes saturn{
                0%{
                    transform: rotateZ(0deg);
                }
                100%{
                    transform: rotateZ(360deg);
                }
            }
            .uranus{
                width: 125px;
                height: 125px;
                border-radius: 125px;
                background-image: url(./uranus.jpg);
                background-size: cover;
                position: absolute;
                right: 850px;
                top: 200px;
                transform-origin: 700px;
                animation-name: uranus;
                animation-timing-function: linear;
                animation-duration: 3s;
                animation-iteration-count: infinite;
                animation-delay: 3.5s;
            }
            @keyframes uranus{
                0%{
                    transform: rotateZ(0deg);
                }
                100%{
                    transform: rotateZ(360deg);
                }
            }
            .neptune{
                width: 129px;
                height: 129px;
                border-radius: 129px;
                background-image: url(./neptune.jpg);
                background-size: cover;
                position: absolute;
                left: 800px;
                top: 100px;
                transform-origin: -800px;
                animation-name: neptune;
                animation-timing-function: linear;
                animation-iteration-count: infinite;
                animation-duration: 3s;
                animation-delay: 1s;
            }
            @keyframes neptune{
                0%{
                    transform: rotateZ(0deg);
                }
                100%{
                    transform: rotateZ(360deg);
                }
            }
        </style>
    </head>
    <body>
        <div class="sun">
            <div class="mercury"></div>
            <div class="venus"></div>
            <div class="earth"></div>
            <div class="mars"></div>
            <div class="jupiter"></div>
            <div class="saturn"></div>
            <div class="uranus"></div>
            <div class="neptune"></div>
        </div>
    </body>
</html>
